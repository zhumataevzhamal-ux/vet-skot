<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Меркурий</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <header class="header">
    <a class="header__brand" href="/">
      <img class="header__logo" src="/assets/mercury-alpha-mini.png" width="30" height="35" alt="">
      <span class="header__title">Меркурий</span>
    </a>

    <nav class="header__nav">
      <a class="nav-item nav-item--lang is-active" href="#" data-lang="ru">РУС</a>
      <a class="nav-item nav-item--lang" href="#" data-lang="en">ENG</a>
      <a class="nav-item nav-item--argus" href="https://argus.vetrf.ru/pub/operatorui?_action=listForeignEnterprise" target="_blank" rel="noopener noreferrer">
        <svg class="nav-item__icon nav-item__icon--share" viewBox="0 64 1792 1600" preserveAspectRatio="none" aria-hidden="true">
          <path d="M1792 640q0 26-19 45l-512 512q-19 19-45 19t-45-19-19-45v-256h-224q-98 0-175.5 6t-154 21.5-133 42.5-105.5 69.5-80 101-48.5 138.5-17.5 181q0 55 5 123 0 6 2.5 23.5t2.5 26.5q0 15-8.5 25t-23.5 10q-16 0-28-17-7-9-13-22t-13.5-30-10.5-24q-127-285-127-451 0-199 53-333 162-403 875-403h224v-256q0-26 19-45t45-19 45 19l512 512q19 19 19 45z"/>
        </svg>
        <span>Аргус</span>
      </a>
      <a class="nav-item nav-item--help" href="#" data-placeholder>
        <span class="nav-item__icon nav-item__icon--help" aria-hidden="true"></span>
        <span>Помощь</span>
      </a>
    </nav>
  </header>

  <!-- панель вкладок -->
  <nav class="tabs">
    <span class="tabs__apps" aria-hidden="true">
      <svg viewBox="0 0 24 24">
        <rect x="0"  y="0"  width="10" height="10" fill="#98c291"/>
        <rect x="14" y="0"  width="10" height="10" fill="#84bde4"/>
        <rect x="0"  y="14" width="10" height="10" fill="#fec16b"/>
        <rect x="14" y="14" width="10" height="10" fill="#d77362"/>
      </svg>
    </span>
    <a class="tab tab--active" href="#" data-placeholder>
      <svg class="tab__icon" viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="12" r="11" fill="#2b7dbc"/>
        <path d="M6.5 12.5l3.2 3.2 7-7" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span>Проверить ВСД</span>
    </a>
  </nav>

  <!-- заголовок страницы + поиск + печать -->
  <div class="page-head content">
    <h1 class="page-head__title">Просмотр информации о ВСД</h1>
    <div class="page-head__tools">
      <form class="search" role="search" onsubmit="return false">
        <input class="search__input" type="text" aria-label="поиск по коду ветеринарного документа"
               placeholder="поиск по коду ветеринарного документа">
        <button class="search__btn" type="button" aria-label="Найти" tabindex="-1">
          <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" aria-hidden="true">
            <circle cx="10.5" cy="10.5" r="6.5"/>
            <line x1="15.5" y1="15.5" x2="20.5" y2="20.5"/>
          </svg>
        </button>
      </form>
      <a class="print-link" id="print-link" href="#">
        <svg class="print-link__icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M6 2h12v5H6z"/>
          <rect x="3" y="8" width="18" height="8" rx="1"/>
          <rect x="6.5" y="12.5" width="11" height="8" fill="#fff" stroke="currentColor" stroke-width="1.4"/>
          <rect x="16" y="10.5" width="2.5" height="2" fill="#fff"/>
        </svg>
        Печать
      </a>
    </div>
  </div>

  <main id="app" class="content"></main>

  <footer class="footer">
    <div class="footer__content">
      <b class="footer__brand">Меркурий</b> версия 101.3 © 2010-2026© 2010-2026
    </div>
  </footer>

  <button class="scroll-up" type="button" aria-label="Наверх" hidden>
    <svg class="scroll-up__icon" viewBox="77 269 998 966" aria-hidden="true">
      <path d="M1075 352q0 13-10 23l-466 466q-10 10-23 10t-23-10l-466-466q-10-10-10-23t10-23l50-50q10-10 23-10t23 10l393 393 393-393q10-10 23-10t23 10l50 50q10 10 10 23zm0 384q0 13-10 23l-466 466q-10 10-23 10t-23-10l-466-466q-10-10-10-23t10-23l50-50q10-10 23-10t23 10l393 393 393-393q10-10 23-10t23 10l50 50q10 10 10 23z"/>
    </svg>
  </button>

  <script src="/js/app.js"></script>
</body>
</html>
