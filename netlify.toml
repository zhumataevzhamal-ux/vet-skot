# Статический сайт: сборки нет, публикуем корень репозитория как есть.
[build]
  publish = "."
  command = ""

# Несуществующий мок -> честный 404 (иначе сработает правило ниже
# и вместо JSON вернётся index.html).
[[redirects]]
  from = "/mock/*"
  to = "/index.html"
  status = 404

# Роутинг base_url/<hash-key>: любой путь отдаёт index.html.
# Существующие файлы (css, js, assets, mock) отдаются как есть.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
